services:
  api:
    build:
      context: ./src/api
    ports:
      - "3000:3000"
    environment:
      SQLITE_PATH: /data/app.db
      RECOVERY_SECRET: ${RECOVERY_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - sqlite-data:/data

  front:
    build:
      context: ./src/front
    ports:
      - "3001:3000"
    environment:
      API_URL: http://api:3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src/front:/app
      - front-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  sqlite-data:
  front-node-modules:
