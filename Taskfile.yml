version: "3"

tasks:
  dev:api:
    desc: Run the API locally with hot reload (Air)
    dir: src/api
    cmds:
      - air

  dev:front:
    desc: Run the Front locally
    dir: src/front
    cmds:
      - npm run dev

  test:api:
    desc: Run API tests
    dir: src/api
    cmds:
      - go test ./...

  test:front:
    desc: Run Front tests
    dir: src/front
    cmds:
      - npm test

  build:api:
    desc: Build the API binary
    dir: src/api
    cmds:
      - go build -o bin/api ./cmd/api

  build:front:
    desc: Build the Front for production
    dir: src/front
    cmds:
      - npm run build

  migrate:up:
    desc: Apply database migrations
    dir: src/api
    cmds:
      - migrate -path migrations -database "sqlite3://$SQLITE_PATH" up

  migrate:down:
    desc: Revert the last database migration
    dir: src/api
    cmds:
      - migrate -path migrations -database "sqlite3://$SQLITE_PATH" down 1

  docker:up:
    desc: Run API and Front together via Docker Compose
    cmds:
      - docker compose up --build

  docker:down:
    desc: Stop and remove the Docker Compose services
    cmds:
      - docker compose down
